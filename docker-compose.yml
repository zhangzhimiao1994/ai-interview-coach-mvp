services:
  interview-coach:
    build:
      context: .
    container_name: ai-interview-coach
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      DATABASE_URL: file:/app/data/prod.db
      RUN_DB_SEED: ${RUN_DB_SEED:-false}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - app-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  app-data:
